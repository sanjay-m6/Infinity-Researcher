name: Build Application (v0.1.0 Cross-Platform)

# ==============================================================================
# Infinity Researcher — Build & Packaging Workflow
# Version: v0.1.0
#
# BUG FIXES IN THIS VERSION:
# 1. Fixed Windows Loader Fault 0xc0000139 (STATUS_ENTRYPOINT_NOT_FOUND):
#    Tao/Wry TaskDialogIndirect entrypoint failure resolved by injecting Common
#    Controls v6 (comctl32.dll) manifest dependency via MSVC linker flags in build.rs.
# 2. Fixed CVT1100 Duplicate Resource Collision:
#    Prevented manifest collision between tauri_build and MSVC linker args via
#    tauri_build::WindowsAttributes::new_without_app_manifest().
# 3. Eliminated Shell & Toolchain Dependencies:
#    Removed hardcoded powershell -Command Expand-Archive and where.exe calls,
#    replacing them with pure-Rust in-memory zip decompression.
# 4. Eliminated Hardcoded OS Paths:
#    Replaced %APPDATA%, %USERPROFILE%, and %HOME% path concatenations with
#    standard dirs crate resolution across Windows, Linux, and macOS.
#
# NEW FEATURES IN THIS VERSION:
# 1. Cross-Platform Operating System Support:
#    Full tier-1 support for Windows 10/11 (x64/ARM64), Linux (Ubuntu, Debian,
#    Fedora via AppImage, .deb, and .rpm), and macOS (Apple Silicon M1-M4 & Intel).
# 2. Platform Abstraction Layer:
#    Modular Rust platform module (src-tauri/src/platform/) providing cross-platform
#    path resolution, background process spawning, and runtime info.
# 3. Dynamic Platform IPC:
#    Exposed app_platform Tauri command and getAppPlatform() frontend API for live
#    OS, architecture, and storage diagnostic reporting.
# 4. In-App Updates System:
#    Tauri v2 updater integration with Minisign Ed25519 verification, Stable/Beta
#    channel controls, and automated multi-platform latest.json generation.
# 5. Production Documentation Suite:
#    10 platform guides in docs/platform/ detailing build, packaging, and signing.
# ==============================================================================

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-and-release-summary:
    name: Application Version & Release Notes Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Version Synchronization
        run: node scripts/version-check.mjs

      - name: Publish Build Summary & Changelog to Job Summary
        run: |
          echo "## 🚀 Infinity Researcher v0.1.0 — Cross-Platform Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ Bug Fixes in v0.1.0" >> $GITHUB_STEP_SUMMARY
          echo "- **Windows Loader Fault \`0xc0000139\` (\`STATUS_ENTRYPOINT_NOT_FOUND\`):** Fixed missing \`TaskDialogIndirect\` entrypoint by embedding Windows Common Controls v6.0.0.0 manifest dependency in \`src-tauri/build.rs\`." >> $GITHUB_STEP_SUMMARY
          echo "- **Duplicate Resource Collision (\`CVT1100\`):** Used \`WindowsAttributes::new_without_app_manifest()\` to prevent duplicate manifest injection." >> $GITHUB_STEP_SUMMARY
          echo "- **External Shell Dependencies:** Replaced PowerShell \`Expand-Archive\` and \`where.exe\` with pure-Rust in-memory ZIP decompression via \`zip\` crate." >> $GITHUB_STEP_SUMMARY
          echo "- **Hardcoded OS Paths:** Replaced \`%APPDATA%\` and \`%USERPROFILE%\` with cross-platform directory resolution via \`dirs\` crate." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✨ New Features in v0.1.0" >> $GITHUB_STEP_SUMMARY
          echo "- **Full Cross-Platform Support:** Windows 10/11 (x64/ARM64), Linux (AppImage, Debian \`.deb\`, RPM \`.rpm\`), macOS Apple Silicon (M1–M4 ARM64) and Intel (\`.dmg\`, \`.app\`)." >> $GITHUB_STEP_SUMMARY
          echo "- **Platform Abstraction Layer:** Created \`src-tauri/src/platform/\` module for unified storage paths and process management." >> $GITHUB_STEP_SUMMARY
          echo "- **Dynamic Platform Diagnostics:** Added \`app_platform\` Tauri command and \`getAppPlatform()\` UI hook." >> $GITHUB_STEP_SUMMARY
          echo "- **Signed In-App Automatic Updates:** Configured Tauri v2 updater with Minisign Ed25519 signature verification." >> $GITHUB_STEP_SUMMARY
          echo "- **Multi-Platform Update Manifest Generator:** Added \`scripts/generate-update-manifest.mjs\`." >> $GITHUB_STEP_SUMMARY
          echo "- **Comprehensive Documentation:** Added 10 production architecture guides in \`docs/platform/\`." >> $GITHUB_STEP_SUMMARY

  build-cross-platform:
    name: Build & Package (${{ matrix.platform_name }})
    needs: version-and-release-summary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_name: Windows x64
            artifact_key: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform_name: Linux x64
            artifact_key: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_name: macOS Apple Silicon
            artifact_key: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            platform_name: macOS Intel
            artifact_key: macos-x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Native Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            squashfs-tools \
            rpm

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust Stable (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Build Python Sidecar Engine
        shell: bash
        run: |
          python scripts/build-python-sidecar.py --target ${{ matrix.target }} --stub

      - name: Build Tauri Desktop Application Packages
        shell: bash
        run: |
          BUILD_FLAG=""
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            BUILD_FLAG="--debug"
          fi
          npm run tauri build -- $BUILD_FLAG --target ${{ matrix.target }}

      - name: Verify Release Artifacts & Generate Checksums
        shell: bash
        run: |
          TARGET_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            TARGET_DIR="src-tauri/target/${{ matrix.target }}/debug/bundle"
          fi
          if [ -d "$TARGET_DIR" ]; then
            node scripts/verify-release-artifacts.mjs "$TARGET_DIR" --generate-checksums
          else
            echo "Artifact directory $TARGET_DIR not found"
            exit 1
          fi

      - name: Upload Platform Build Packages
        uses: actions/upload-artifact@v4
        with:
          name: infinity-researcher-v0.1.0-${{ matrix.artifact_key }}
          path: |
            src-tauri/target/${{ matrix.target }}/**/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/**/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/**/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/**/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/**/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/**/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/**/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/**/bundle/**/*.tar.gz
            src-tauri/target/${{ matrix.target }}/**/bundle/**/*.zip
            src-tauri/target/${{ matrix.target }}/**/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/**/bundle/**/SHA256SUMS.txt
          retention-days: 14
