name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Test, Security & Build Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "python-engine/requirements*.txt"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Python Engine Dependencies
        shell: bash
        run: |
          if [ -f python-engine/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r python-engine/requirements.txt
            pip install pytest
          fi

      - name: Repository Secret & Hygiene Audit
        run: npm run audit:secrets

      - name: Application Version Consistency Check
        run: npm run version:check

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Frontend Unit & Integration Tests (Vitest)
        run: npm run test

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Rust Code Formatting (cargo fmt)
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Rust Clippy Lint (cargo clippy)
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust Unit Tests (cargo test)
        working-directory: ./src-tauri
        run: cargo test

      - name: Python Engine Tests (pytest)
        shell: bash
        run: |
          if [ -d python-engine/tests ]; then
            python -m pytest python-engine/tests -q
          fi
