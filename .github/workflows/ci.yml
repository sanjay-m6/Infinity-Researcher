name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-and-hygiene:
    name: Frontend Quality, Hygiene & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Repository Secret & Hygiene Audit
        run: npm run audit:secrets

      - name: Application Version Consistency Check
        run: npm run version:check

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Frontend Unit & Integration Tests (Vitest)
        run: npm run test

      - name: Build Frontend Production Bundle
        run: npm run build

  python-engine:
    name: Python Engine Tests & Stub Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "python-engine/requirements*.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python-engine/requirements.txt ]; then
            pip install -r python-engine/requirements.txt
          fi
          pip install pytest

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall python-engine/ -q

      - name: Python Engine Tests (pytest)
        run: |
          if [ -d python-engine/tests ]; then
            python -m pytest python-engine/tests -q
          else
            echo "No python-engine/tests directory found; skipping pytest."
          fi

      - name: Verify Python Sidecar Stub Generator
        run: |
          python scripts/build-python-sidecar.py --stub

  rust-quality-matrix:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (WebKitGTK, AppIndicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust Code Formatting (cargo fmt)
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Rust Clippy Lint (cargo clippy)
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust Unit & Integration Tests (cargo test)
        working-directory: ./src-tauri
        run: cargo test

  ci-status:
    name: Continuous Integration Status Gate
    needs: [frontend-and-hygiene, python-engine, rust-quality-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: CI Checks Passed
        run: echo "All frontend, Python, and Rust cross-platform CI checks completed successfully."
