name: Release Packaging & Distribution

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run build without publishing release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-package:
    name: Package ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows'
            os: windows-latest
            target: 'x86_64-pc-windows-msvc'
            bundle_types: 'msi'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Quality Gate (Lint, Typecheck, Unit Tests)
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Backend Quality Gate (Format, Clippy, Tests)
        working-directory: ./src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Build Standalone Tauri Bundle
        run: npx tauri build --bundles ${{ matrix.bundle_types }}

      - name: Compute SHA-256 Checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi", "src-tauri/target/release/*.exe" -ErrorAction SilentlyContinue
          foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash
            "$hash  $($file.Name)" | Out-File -FilePath "$($file.FullName).sha256" -Encoding ascii
            Write-Host "Artifact: $($file.Name) | SHA256: $hash"
          }

      - name: Upload Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sha256
            src-tauri/target/release/research-paper-scraper.exe
            src-tauri/target/release/research-paper-scraper.exe.sha256
          draft: true
          prerelease: false
          generate_release_notes: true
