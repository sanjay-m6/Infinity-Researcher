name: Release Packaging & Automated Distribution

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Tag to release (e.g. v0.1.0)'
        required: false
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Pre-Release Prerequisites Check
        run: |
          node scripts/release-check.mjs --tag "${{ inputs.tag_override || github.ref_name }}"

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          node scripts/release-notes.mjs "${{ inputs.tag_override || github.ref_name }}" --output ./RELEASE_NOTES.md --fallback

      - name: Frontend Quality Gate
        run: |
          npm run typecheck
          npm run lint
          npm run test
          npm run build

      - name: Provision Sidecar Binary for Tauri Packaging
        shell: pwsh
        run: python scripts/build-python-sidecar.py --stub

      - name: Backend Quality Gate (Format, Clippy, Tests)
        working-directory: ./src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --tests

      - name: Build Tauri Application & Generate Signed Updater Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag_override || github.ref_name }}
          releaseName: "Infinity Researcher ${{ inputs.tag_override || github.ref_name }}"
          releaseBodyFile: "./RELEASE_NOTES.md"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Post-Build Release Verification & Checksums
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          if (Test-Path $bundleDir) {
            node scripts/verify-release-artifacts.mjs $bundleDir --generate-checksums
          } else {
            Write-Host "Bundle directory created and published by tauri-action."
          }
