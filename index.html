<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Infinity Researcher — An AI-powered research workspace, created by Sanjay. Discover. Understand. Research."
    />
    <meta name="author" content="Sanjay" />
    <meta name="publisher" content="Infinity Web Technology" />
    <meta name="copyright" content="© 2026 Sanjay. All rights reserved." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/application.png" />
    <title>Infinity Researcher — Discover. Understand. Research.</title>
    <script>
      (function () {
        try {
          var storedSettings = localStorage.getItem("rps_appearance_settings");
          var mode = null;
          if (storedSettings) {
            mode = JSON.parse(storedSettings).mode;
          }
          if (!mode) {
            mode = localStorage.getItem("rps_theme");
          }
          var isDark =
            mode === "dark" ||
            ((!mode || mode === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--background, #f8fafc);
        color: var(--foreground, #0f172a);
      }
      html.dark,
      html.dark body,
      html.dark #root {
        background-color: var(--background, #070b12);
        color: var(--foreground, #f8fafc);
      }
    </style>
  </head>
  <body
    class="bg-background text-foreground antialiased selection:bg-indigo-500 selection:text-white"
  >
    <div id="root"></div>
    <script>
      // Block default browser right-click context menu (Back, Refresh, Save as, Print, More tools)
      document.addEventListener(
        "contextmenu",
        function (e) {
          e.preventDefault();
        },
        { capture: true }
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
