[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-scraper-engine"
version = "0.1.0"
description = "High-coverage academic research paper discovery and scraping engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapy>=2.11.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "soupsieve>=2.5",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
