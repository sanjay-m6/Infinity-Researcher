<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Institutional Login Required - University Access</title>
</head>
<body>
    <div class="login-container">
        <h1>Please Sign In Through Your Institution</h1>
        <p>This PDF requires an active subscription or pay-per-view access.</p>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Institutional ID">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
